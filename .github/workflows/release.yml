name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for a dry run)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: macos-universal, os: macos-latest }
          - { name: windows-x86_64, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config cmake libgtk-3-dev libssl-dev libx11-dev
          libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev
          libgl1-mesa-dev

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/package-linux.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/package-macos.sh --dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: ./scripts/package-windows.ps1
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: gitup-${{ matrix.name }}
          path: |
            target/*.tar.gz
            target/*.dmg
            target/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The release body comes from the changelog rather than from the commit
      # list. Generated notes describe what changed in the repository; the
      # changelog describes what changed for the person downloading it.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No changelog section for $version." > NOTES.md
          fi
          cat NOTES.md

      # Drafted rather than published: nothing signed and nothing notarized
      # should go out without a person looking at it first. Publishing is one
      # click in the Releases tab.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: NOTES.md
          files: artifacts/*
