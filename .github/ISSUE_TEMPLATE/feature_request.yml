name: Feature request
description: Suggest something Gitup should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: |
        The task, rather than the feature. Knowing what you are trying to
        accomplish often turns up a better answer than the one being asked for.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like Gitup to do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
      description: Another client, the command line, or living without it.
